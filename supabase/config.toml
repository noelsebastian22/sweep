project_id = "ifwyufrepqkzsicjinfi"

# Edge function verify_jwt settings, tracked here so redeploys don't silently
# drop or add auth requirements via a CLI flag no one remembers.
#
# health: public — the UptimeRobot keepalive monitor pings this with no auth.
# It only exposes a Postgres liveness check, no data.
[functions.health]
verify_jwt = false

# seed: privileged — invoked manually with the service role key as a bearer
# token (checked again inside the function body). Requires a valid JWT at the
# gateway on top of that.
[functions.seed]
verify_jwt = true

# scan-create: authenticated — called with the caller's own user JWT. tenant_id is
# derived from that token, never a request field.
[functions.scan-create]
verify_jwt = true

# tick: cron-triggered only, over pg_net. The cron job's own net.http_post call supplies
# the service role key as the bearer token, so nothing else is expected to invoke it.
[functions.tick]
verify_jwt = true
